<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reroll Items</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="main.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <span class="brand-dot"></span>
      <span class="eyebrow">Katalog / Reroll</span>
    </div>
    <h1>Reroll Items</h1>
    <p class="subhead">
      Pilih gender untuk melihat slot item. Klik <strong>Salin</strong> untuk menyalin ID unik.
    </p>
  </header>

  <div class="gender-bar">
    <div class="gender-buttons" role="tablist" id="genderButtons"></div>
    <button class="info-btn" id="infoBtn" type="button" aria-label="Buka info update">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>Info</span>
    </button>
  </div>

  <div class="legend-bar">
    <span class="legend-label">Rarity</span>
    <span class="legend-item common">Common</span>
    <span class="legend-item uncommon">Uncommon</span>
    <span class="legend-item epic">Epic</span>
    <span class="legend-item legend">Legend</span>
    <span class="legend-item unknown">???</span>
  </div>

  <div id="panelsContainer"></div>

  <footer>
    © 2025 Reroll Items — Pilih gender, jelajahi slot item
  </footer>

  <div id="toast" class="toast-message" role="status" aria-live="polite">
    <span class="toast-dot"></span>
    <span id="toastText">Berhasil disalin</span>
  </div>

  <div class="modal-overlay" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span class="modal-title-dot"></span>
          <span class="modal-title" id="modalTitle">Info Update</span>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Tutup">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="info-grid" id="infoGrid"></div>
      </div>
    </div>
  </div>

  <!-- PENTING: Urutan script harus: config.js → configData.js → main.js -->
  <script src="config.js"></script>
  <script src="configData.js"></script>
  <script src="main.js"></script>
</body>
</html>
